<!-- @dsCard group="Actions" height=200 subtitle="Light 與 Brand 區塊 · enabled / disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Primary Button — preview</title>
<style>
  body { margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  .pane { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px; border-radius: 24px; }
  .tag { font: 600 13px/16px "Space Grotesk", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="row">
  <div class="pane jade-section" data-theme="light">
    <span class="tag">✦ Light 區塊</span>
    <button class="jade-primary-button" type="button"><span>View all work</span><span class="jade-primary-button__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span></button>
    <button class="jade-primary-button" type="button" disabled><span>Disabled</span><span class="jade-primary-button__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span></button>
  </div>
  <div class="pane jade-section" data-theme="brand">
    <span class="tag">✦ Brand 區塊</span>
    <button class="jade-primary-button" type="button"><span>View my work</span><span class="jade-primary-button__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span></button>
    <button class="jade-primary-button" type="button" disabled><span>Disabled</span><span class="jade-primary-button__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span></button>
  </div>
</div>
</body>
</html>
